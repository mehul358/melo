[build]
  publish = "."

[[redirects]]
  from = "/hindi/*"
  to = "https://kids.melo.ink/hindi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/hindi"
  to = "https://kids.melo.ink/hindi/"
  status = 301
  force = true

[[redirects]]
  from = "/portugal-kids/*"
  to = "https://kids.melo.ink/portugal/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/portugal-kids"
  to = "https://kids.melo.ink/portugal/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
